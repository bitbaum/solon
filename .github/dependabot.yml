version: 2
updates:
  # JavaScript/TypeScript dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Dependabot cannot order git tags: PR #97 "bumped" this pin from v1.1.0
    # DOWN to v1.0.0 and auto-merge shipped the downgrade, silently reverting
    # the --on-accent contrast token. The pin is bumped by hand on release.
    ignore:
      - dependency-name: "@fleet/design-tokens"
    # One PR for every patch/minor bump. Separate PRs each rewrite
    # pnpm-lock.yaml, so merging one conflicts the rest — and closing a
    # conflicted Dependabot PR does not requeue it, it tells Dependabot to
    # skip that release (#177-#180 dropped next, react-dom, prettier and
    # vitest that way). Majors still arrive alone, to be read on their own.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
