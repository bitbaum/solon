name: Law register load

# By hand: read a law register and import it into the production database:
# LexFind's list of every federal and cantonal act, or Liechtenstein's
# Systematic Register (a PDF on gesetze.li). About two minutes: one polite
# request per slice of each authority's tree, then one transaction. Runs on the
# box from a fresh checkout of main, with the box's own DATABASE_URL read into
# this process alone. Rerunning it changes nothing unless the register changed.
#
# dry_run=true (default) reports what would change and writes nothing.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which register"
        type: choice
        options: [lexfind, liechtenstein]
        default: lexfind
      dry_run:
        description: "Only report what would change"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run it on the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SHA: ${{ github.sha }}
          DRY: ${{ inputs.dry_run }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          IP=167.233.22.31
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id -o BatchMode=yes "ubuntu@$IP" \
            "SHA=$SHA DRY=$DRY SOURCE=$SOURCE bash -s" > out.txt 2>&1 <<'REMOTE' || status=$?
          set -euo pipefail
          WD=$(mktemp -d /tmp/solon-law.XXXXXX)
          trap 'rm -rf "$WD"' EXIT
          git clone -q https://github.com/bitbaum/solon "$WD/repo"
          cd "$WD/repo" && git checkout -q "$SHA"
          PNPM="corepack pnpm"; $PNPM --version >/dev/null 2>&1 || PNPM="npx --yes pnpm@11"
          $PNPM install --frozen-lockfile >install.log 2>&1 || { echo "install failed:"; tail -n 20 install.log; exit 1; }
          envf=/opt/solon/shared/.env; [ -f "$envf" ] || envf=/opt/solon/app/.env
          set -a
          eval "$(grep -E '^(DATABASE_URL|PLACES_SNAPSHOT_DIR)=' "$envf")"
          set +a
          export PLACES_SNAPSHOT_DIR="${PLACES_SNAPSHOT_DIR:-/opt/solon/shared/places-snapshots}"
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          $PNPM run law:register "$SOURCE" $flag 2>&1 | grep -vE 'postgres(ql)?://' | tail -n 60
          REMOTE
          rm -f ~/.ssh/id
          while IFS= read -r line; do echo "::notice::$line"; done < out.txt
          exit "${status:-0}"
