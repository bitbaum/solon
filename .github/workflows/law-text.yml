name: Law text load

# By hand: read the text of the Confederation's laws from Fedlex, or
# Liechtenstein's from Lilex (gesetze.li), and store it in the production
# database (design L1, L2). Resumable: an act whose version is already
# held is not fetched again, so run it again until "remaining" is 0. About one to
# two seconds per Fedlex act and three per Lilex act, politely paced; a full load
# takes a few hours. Lilex stops the run if it answers with its proof-of-work page.
# Runs on the box from a fresh checkout of main with the box's own DATABASE_URL.
#
# dry_run=true (default) fetches and parses but stores nothing.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Whose laws"
        type: choice
        options: [fedlex, lilex, cantons, zhlex]
        default: fedlex
      authority:
        description: "Cantons only: one canton's key (zh, be, ...), or empty for all"
        type: string
        default: ""
      lang:
        description: "Language of the texts (Fedlex only)"
        type: choice
        options: [de, fr, it]
        default: de
      limit:
        description: "Store at most this many versions in this run"
        type: string
        default: "1500"
      dry_run:
        description: "Fetch and parse, store nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Run it on the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SHA: ${{ github.sha }}
          DRY: ${{ inputs.dry_run }}
          LANGUAGE: ${{ inputs.lang }}
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
          AUTHORITY: ${{ inputs.authority }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^[0-9]{1,5}$ ]] || { echo "limit must be a number"; exit 1; }
          [[ "$AUTHORITY" =~ ^[a-z]{0,20}$ ]] || { echo "authority must be a key like zh"; exit 1; }
          IP=167.233.22.31
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "ubuntu@$IP" \
            "SHA=$SHA DRY=$DRY LANGUAGE=$LANGUAGE SOURCE=$SOURCE LIMIT=$LIMIT AUTHORITY=$AUTHORITY bash -s" > out.txt 2>&1 <<'REMOTE' || status=$?
          set -euo pipefail
          WD=$(mktemp -d /tmp/solon-law-text.XXXXXX)
          trap 'rm -rf "$WD"' EXIT
          git clone -q https://github.com/bitbaum/solon "$WD/repo"
          cd "$WD/repo" && git checkout -q "$SHA"
          PNPM="corepack pnpm"; $PNPM --version >/dev/null 2>&1 || PNPM="npx --yes pnpm@11"
          $PNPM install --frozen-lockfile >install.log 2>&1 || { echo "install failed:"; tail -n 20 install.log; exit 1; }
          envf=/opt/solon/shared/.env; [ -f "$envf" ] || envf=/opt/solon/app/.env
          set -a
          eval "$(grep -E '^(DATABASE_URL|PLACES_SNAPSHOT_DIR)=' "$envf")"
          set +a
          export PLACES_SNAPSHOT_DIR="${PLACES_SNAPSHOT_DIR:-/opt/solon/shared/places-snapshots}"
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          auth=""; [ -n "$AUTHORITY" ] && auth="--authority $AUTHORITY"
          $PNPM run law:text "$SOURCE" --lang "$LANGUAGE" --limit "$LIMIT" $auth $flag 2>&1 | grep -vE 'postgres(ql)?://' | tail -n 80
          REMOTE
          rm -f ~/.ssh/id
          while IFS= read -r line; do echo "::notice::$line"; done < out.txt
          exit "${status:-0}"
