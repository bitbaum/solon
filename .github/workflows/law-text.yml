name: Law text load

# By hand: read the text of the Confederation's laws from Fedlex, or
# Liechtenstein's from Lilex (gesetze.li), or Wyoming's from the Legislature's
# downloads (wyoleg), or New Hampshire's RSA from the General Court's site
# (gcnh: about 11 seconds a chapter, as its robots.txt asks, so a full load of
# some 1,700 chapters is two runs at limit 1000), or the European Union's
# regulations and directives in force from Cellar and EUR-Lex (eurlex: tens of
# thousands of acts, so a full load is many runs at limit 1500; `year` reads only
# those CELEX years, e.g. 2016 for a quick check), or Germany's federal acts from
# Gesetze im Internet (gii: some 6,500 acts a request a second, so a full load is
# several runs at limit 1500; `acts` reads only those, e.g. bgb,gg), or Austria's
# consolidated federal acts in force from the RIS of the Federal Chancellery (ris:
# some thousands of acts, two requests and about three seconds an act, so a full load
# is a few runs at limit 1500), or the United Kingdom's Public General Acts and
# Statutory Instruments from legislation.gov.uk (ukleg: one request every 5 seconds, as
# its robots.txt asks, so a run at limit 1500 takes about two hours and a full load is
# many runs; `year` and `types` narrow a run, e.g. year 2024 types ukpga), and store it in the production
# database (design L1, L2). Resumable: an act whose version is already
# held is not fetched again, so run it again until "remaining" is 0. About one to
# two seconds per Fedlex act and three per Lilex act, politely paced; a full load
# takes a few hours. Lilex stops the run if it answers with its proof-of-work page.
# Runs on the box from a fresh checkout of main with the box's own DATABASE_URL.
#
# dry_run=true (default) fetches and parses but stores nothing.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Whose laws"
        type: choice
        options:
          [
            fedlex,
            lilex,
            cantons,
            zhlex,
            municipal,
            lexwork,
            recut,
            recut-eurlex,
            recut-gii,
            recut-municipal,
            recut-ukleg,
            legilux,
            riigiteataja,
            eurlex,
            ukleg,
            ris,
            gii,
            wyoleg,
            gcnh,
            refresh,
            box-status,
            box-stop,
          ]
        default: fedlex
      authority:
        description: "Cantons only: one canton's key (zh, be, ...), or empty for all"
        type: string
        default: ""
      lang:
        description: "Language of the texts (Fedlex only)"
        type: choice
        options: [de, fr, it]
        default: de
      publisher:
        description: "Municipal only: a collection's key (zurich-city, ...)"
        type: string
        default: zurich-city
      history:
        description: "Municipal only: also store the earlier versions the publisher lists"
        type: boolean
        default: false
      year:
        description: "EU (eurlex) only: CELEX years to read, comma-separated (2016,2024), or empty for all"
        type: string
        default: ""
      act:
        description: "Austria (ris) only: Gesetzesnummern to read, comma-separated (10001622,10000138), or empty for all"
        type: string
        default: ""
      acts:
        description: "Germany (gii) only: acts to read, by the portal's abbreviation, comma-separated (bgb,gg), or empty for all"
        type: string
        default: ""
      types:
        description: "UK (ukleg) only: types to read, comma-separated (ukpga,uksi), or empty for both"
        type: string
        default: ""
      batches:
        description: "Run this many batches of `limit` one after another, stopping early when nothing remains or a batch makes no progress (1 = one batch)"
        type: string
        default: "1"
      limit:
        description: "Store at most this many versions in each batch"
        type: string
        default: "1500"
      dry_run:
        description: "Fetch and parse, store nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run it on the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SHA: ${{ github.sha }}
          DRY: ${{ inputs.dry_run }}
          LANGUAGE: ${{ inputs.lang }}
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
          AUTHORITY: ${{ inputs.authority }}
          PUBLISHER: ${{ inputs.publisher }}
          HISTORY: ${{ inputs.history }}
          YEAR: ${{ inputs.year }}
          ACT: ${{ inputs.act }}
          ACTS: ${{ inputs.acts }}
          TYPES: ${{ inputs.types }}
          BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          [[ "$BATCHES" =~ ^[0-9]{1,2}$ ]] || { echo "batches must be a number"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,5}$ ]] || { echo "limit must be a number"; exit 1; }
          [[ "$AUTHORITY" =~ ^[a-z]{0,20}$ ]] || { echo "authority must be a key like zh"; exit 1; }
          [[ "$PUBLISHER" =~ ^[a-z0-9-]{0,30}$ ]] || { echo "publisher must be a key like zurich-city"; exit 1; }
          [[ "$TYPES" =~ ^[a-z,]{0,40}$ ]] || { echo "types must be like ukpga,uksi"; exit 1; }
          [[ "$YEAR" =~ ^[0-9,]{0,60}$ ]] || { echo "year must be years like 2016,2024"; exit 1; }
          [[ "$ACT" =~ ^[0-9,]{0,120}$ ]] || { echo "act must be numbers like 10001622,10000138"; exit 1; }
          [[ "$ACTS" =~ ^[A-Za-z0-9_.,-]{0,300}$ ]] || { echo "acts must be abbreviations like bgb,gg"; exit 1; }
          IP=167.233.22.31
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "ubuntu@$IP" \
            "SHA=$SHA DRY=$DRY LANGUAGE=$LANGUAGE SOURCE=$SOURCE LIMIT=$LIMIT AUTHORITY=$AUTHORITY PUBLISHER=$PUBLISHER HISTORY=$HISTORY YEAR=$YEAR ACT=$ACT ACTS=$ACTS TYPES=$TYPES BATCHES=$BATCHES bash -s" > out.txt 2>&1 <<'REMOTE' || status=$?
          set -euo pipefail
          # The box's memory is the limit, not its patience. Loads that read PDFs, scans or the EU's
          # large pages take one shared turn (two at once ran it out, 2026-11-08, and so did an install
          # beside three loads); loads that mostly wait on a slow publisher (the UK's five seconds a
          # request) share a second turn, so at most two run at once and a slow one never holds up the rest.
          # box-status and box-stop never wait for a turn: they say what holds one, and end it. Cancelling
          # a run in GitHub drops the connection but leaves the box's own process running, so a stuck or
          # cancelled load keeps its turn until box-stop ends it.
          holders() {
            for p in /proc/[0-9]*; do
              ls -l "$p/fd" 2>/dev/null | grep -q 'solon-law-load' || continue
              echo "${p#/proc/}"
            done
          }
          tree() { local c; for c in $(pgrep -P "$1" 2>/dev/null || true); do tree "$c"; done; echo "$1"; }
          if [ "$SOURCE" = "box-status" ]; then
            uptime; free -m; df -h /tmp | tail -1
            for pid in $(holders); do
              echo "turn held by pid $pid, running $(ps -o etime= -p "$pid" | tr -d ' '): $(tr '\0' ' ' < /proc/$pid/cmdline | cut -c1-120)"
            done
            ps -eo pid,etime,rss,args --sort=-rss | grep -E 'tsx|law-text|pnpm|node' | grep -v grep | head -12 | cut -c1-200
            # Where the memory is: every process by resident size and by what it has pushed to swap, the
            # kernel's own account of cache, shared memory and slab, and what the memory-backed filesystems hold.
            echo "--- by resident size (MB), user, command"
            ps -eo rss=,user=,args= --sort=-rss | head -20 | awk '{ printf "%7.0f %-10s", $1/1024, $2; $1=""; $2=""; print substr($0,1,110) }'
            echo "--- by swap (MB), pid, command"
            for p in /proc/[0-9]*; do
              sw=$(awk '/^VmSwap:/ {print $2}' "$p/status" 2>/dev/null || true)
              [ -n "${sw:-}" ] && [ "$sw" -gt 20000 ] && echo "$((sw/1024)) ${p#/proc/} $(tr '\0' ' ' < "$p/cmdline" 2>/dev/null | cut -c1-100)"
            done | sort -rn | head -15
            echo "--- kernel (MB)"
            awk '/^(MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapCached|Shmem|Slab|SReclaimable|SUnreclaim|AnonPages|Mapped|PageTables|SwapTotal|SwapFree|Dirty):/ { printf "%-14s %8.0f\n", $1, $2/1024 }' /proc/meminfo
            echo "--- memory-backed filesystems"
            df -h -t tmpfs 2>/dev/null | head -12
            echo "--- biggest in /tmp and /dev/shm"
            du -sm /tmp/* /dev/shm/* 2>/dev/null | sort -rn | head -8
            echo "--- cgroup limit"
            cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current 2>/dev/null || true
            exit 0
          fi
          if [ "$SOURCE" = "box-stop" ]; then
            # Only the loads whose command names the "publisher" input (a source or publisher key such as
            # ukleg); "all" ends every one. The input's default names nothing, so a bare run ends nothing.
            for pid in $(holders); do
              if [ "$PUBLISHER" != "all" ]; then
                named=0
                for t in $(tree "$pid"); do
                  tr '\0' ' ' < "/proc/$t/cmdline" 2>/dev/null | grep -q -- "$PUBLISHER" && named=1
                done
                [ "$named" = 1 ] || continue
              fi
              echo "ending the tree of pid $pid"
              for t in $(tree "$pid"); do kill -TERM "$t" 2>/dev/null || true; done
            done
            exit 0
          fi
          case "$SOURCE" in
            ukleg|gcnh|wyoleg|legilux|riigiteataja) LOCK="paced" ;;
            *) LOCK="heavy" ;;
          esac
          exec 9>"/tmp/solon-law-load-$LOCK.lock"
          flock 9
          WD=$(mktemp -d /tmp/solon-law-text.XXXXXX)
          trap 'rm -rf "$WD"' EXIT
          git clone -q https://github.com/bitbaum/solon "$WD/repo"
          cd "$WD/repo" && git checkout -q "$SHA"
          PNPM="corepack pnpm"; $PNPM --version >/dev/null 2>&1 || PNPM="npx --yes pnpm@11"
          $PNPM install --frozen-lockfile >install.log 2>&1 || { echo "install failed:"; tail -n 20 install.log; exit 1; }
          envf=/opt/solon/shared/.env; [ -f "$envf" ] || envf=/opt/solon/app/.env
          set -a
          eval "$(grep -E '^(DATABASE_URL|PLACES_SNAPSHOT_DIR)=' "$envf")"
          set +a
          export PLACES_SNAPSHOT_DIR="${PLACES_SNAPSHOT_DIR:-/opt/solon/shared/places-snapshots}"
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          auth=""; [ -n "$AUTHORITY" ] && auth="--authority $AUTHORITY"
          [ "$SOURCE" = "municipal" ] && auth="--publisher $PUBLISHER"
          [ "$HISTORY" = "true" ] && auth="$auth --history"
          [ "$SOURCE" = "eurlex" ] && [ -n "$YEAR" ] && auth="$auth --year $YEAR"
          [ "$SOURCE" = "ris" ] && [ -n "$ACT" ] && auth="$auth --act $ACT"
          [ "$SOURCE" = "gii" ] && [ -n "$ACTS" ] && auth="$auth --act $ACTS"
          [ "$SOURCE" = "ukleg" ] && [ -n "$YEAR" ] && auth="$auth --year $YEAR"
          [ "$SOURCE" = "ukleg" ] && [ -n "$TYPES" ] && auth="$auth --type $TYPES"
          rc=0; last=-1
          for batch in $(seq 1 "$BATCHES"); do
            rc=0
            $PNPM run law:text "$SOURCE" --lang "$LANGUAGE" --limit "$LIMIT" $auth $flag 2>&1 | grep -vE 'postgres(ql)?://' > batch.log || rc=$?
            tail -n 80 batch.log
            # A dry run stores nothing, so a second batch would read the same; a batch that left
            # as much as the one before it made no progress.
            [ "$DRY" = "true" ] && break
            left=$(grep -oE '"remaining(Acts)?": [0-9]+' batch.log | tail -1 | grep -oE '[0-9]+' || true)
            [ "${left:-0}" -gt 0 ] || break
            [ "$left" != "$last" ] || { echo "no progress: $left still remain"; break; }
            last=$left
            echo "batch $batch done, $left remain"
          done
          exit "$rc"
          REMOTE
          rm -f ~/.ssh/id
          while IFS= read -r line; do echo "::notice::$line"; done < out.txt
          exit "${status:-0}"
