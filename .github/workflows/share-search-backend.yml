name: Share search backend

# The law chat can search the open web only when a search backend is
# configured (src/lib/law/ask/research.ts reads SEARXNG_URL, BRAVE_SEARCH_API_KEY
# or TAVILY_API_KEY): an authority's page for what the law leaves to it, a
# deadline set each year, a form. Substrata shares the same backend this way. Causius's runtime env on the same box carries the SearXNG
# settings; this copies them across and redeploys, the same way Causius copies
# its model keys from Heidi (causius/.github/workflows/share-model-keys.yml).
# Values never leave the box and never appear in a log.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy the search settings on the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IP=167.233.22.31
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id -o BatchMode=yes "ubuntu@$IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=""; dst=""
          for c in /opt/causius/shared/.env /opt/causius/app/.env; do [ -f "$c" ] && { src=$c; break; }; done
          for c in /opt/solon/shared/.env /opt/solon/app/.env; do [ -f "$c" ] && { dst=$c; break; }; done
          [ -n "$src" ] || { echo "::error::no Causius runtime env found"; exit 1; }
          [ -n "$dst" ] || { echo "::error::no Solon runtime env found"; exit 1; }
          added=""
          for name in SEARXNG_URL SEARXNG_TOKEN BRAVE_SEARCH_API_KEY TAVILY_API_KEY; do
            if grep -q "^${name}=" "$dst"; then echo "$name already set for Solon; left as it is"; continue; fi
            line=$(grep -m1 "^${name}=" "$src" || true)
            [ -n "$line" ] || { echo "$name not present in Causius's env"; continue; }
            printf '%s\n' "$line" >> "$dst"
            added="$added $name"
          done
          chmod 600 "$dst"
          echo "added:${added:- none}"
          REMOTE
          rm -f ~/.ssh/id

      - name: Redeploy so the app reads them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
