# pnpm 11 blocks dependency postinstall scripts by default. Allowed:
# - esbuild installs its platform binary (vitest/tsx toolchain)
# - unrs-resolver builds its native resolver (eslint-config-next)
# - puppeteer's postinstall downloads the Chrome it drives — the
#   tests/puppeteer/*.mjs smokes need it.
allowBuilds:
  esbuild: true
  puppeteer: true
  unrs-resolver: true

# Own package published to npm <24h ago; exempt from the minimum-release-age
# supply-chain window. Redundant once the release ages past the window.
minimumReleaseAgeExclude:
  - "@bitbaum/design-tokens"
