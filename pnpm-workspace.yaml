# pnpm 11 blocks dependency postinstall scripts by default. Allowed:
# - esbuild installs its platform binary (vitest/tsx toolchain)
# - unrs-resolver builds its native resolver (eslint-config-next)
# - puppeteer's postinstall downloads the Chrome it drives — the
#   tests/puppeteer/*.mjs smokes need it.
# Denied: pulled in by next-intl for its optional message-extraction tooling,
# which Solon does not use — so their install scripts need not run.
# tesseract.js's only install script is a funding message.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  # bip-kit from its verified Git release builds its dist on install (npm
  # publish of 0.7.x is blocked on the npm trusted-publisher link).
  "@bitbaum/bip-kit@https://codeload.github.com/bitbaum/bip-kit/tar.gz/6189477d5c0c442b8347b50b54828b4f9be9af2c": true
  esbuild: true
  puppeteer: true
  tesseract.js: false
  unrs-resolver: true

# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - "@bitbaum/*"
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms

overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  "vite@8": "^8.2.4"
